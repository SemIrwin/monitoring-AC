name: Relevé des métriques AC

on:
  schedule:
    # Toutes les heures, à h+23 (éviter la minute 0, surchargée chez GitHub).
    - cron: "23 * * * *"
  workflow_dispatch: {}

# Un seul relevé à la fois ; un relevé en cours n'est jamais annulé.
concurrency:
  group: monitoring-ac
  cancel-in-progress: false

permissions:
  contents: write   # commit des relevés dans le dépôt
  pages: write      # déploiement GitHub Pages
  id-token: write   # jeton OIDC exigé par deploy-pages

jobs:
  releve:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.pages-check.outputs.enabled }}
    steps:
      - name: Checkout (branche par défaut)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Relevé ActiveCampaign
        env:
          AC_API_URL: ${{ secrets.AC_API_URL }}
          AC_API_KEY: ${{ secrets.AC_API_KEY }}
        run: node scripts/fetch-metrics.mjs

      - name: Commit des données
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- data site/data 2>/dev/null || git add -A -- site/data
          if git diff --cached --quiet; then
            echo "Aucun changement à committer."
          else
            git commit -m "Relevé automatique des métriques"
            # Nouvelles tentatives si un push concurrent est passé entre-temps.
            pushed=""
            for i in 1 2 3; do
              if git push; then pushed=1; break; fi
              git pull --rebase || git rebase --abort || true
              sleep 3
            done
            if [ -z "$pushed" ]; then
              echo "::error::Impossible de pousser le relevé après 3 tentatives."
              exit 1
            fi
          fi

      # GitHub Pages n'est pas activable sur un dépôt privé en plan Free.
      # On détecte : si Pages est activé (dépôt public, ou compte Pro), le job
      # de publication tourne ; sinon il est sauté sans faire échouer le relevé.
      - name: Pages activé ?
        id: pages-check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" --silent 2>/dev/null; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages n'est pas activé sur ce dépôt — publication sautée. Voir le README (section « Lien public »)."
          fi

  publication:
    needs: releve
    if: needs.releve.outputs.pages_enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Checkout de la tête de branche : inclut le commit de données du job précédent.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Configuration Pages
        uses: actions/configure-pages@v5

      - name: Empaquetage du site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Déploiement GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
